<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Part detail — Brazos Ridge Electronics</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="part">
    <header class="site-header">
      <div>
        <div class="brand">Brazos Ridge Electronics</div>
        <div class="sample-note">Illustrative sample catalog for training</div>
      </div>
      <nav class="nav-links">
        <a href="/index.html">Catalog</a>
        <a href="/cart.html" data-testid="nav-cart">Cart</a>
      </nav>
    </header>

    <main class="layout">
      <section class="panel">
        <p><a href="/index.html">← Back to catalog</a></p>
        <h1 id="part-title" data-testid="part-title">Part</h1>
        <dl class="detail-grid" id="part-details" data-testid="part-details"></dl>
        <div class="field">
          <label for="add-qty">Quantity</label>
          <input id="add-qty" data-testid="add-qty" type="number" min="1" value="1" />
        </div>
        <button type="button" id="add-to-cart" data-testid="add-to-cart">Add to cart</button>
        <p id="add-message" data-testid="add-message" class="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
